spring.application.name=ebank-chatBott
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false
server.port=8084

# Connexions MCP
spring.ai.mcp.client.streamable-http.connections.customer.url=http://customer-service:8081/mcp
spring.ai.mcp.client.streamable-http.connections.account.url=http://ebank-service:8082/mcp

# Eureka
eureka.client.service-url.defaultZone=http://discoveru-service:8761/eureka/

# Discord
discord.token=${DISCORD_BOT_TOKEN}

# MCP
spring.ai.mcp.client.type=SYNC

# Ollama
spring.ai.ollama.base-url=http://host.docker.internal:11434
spring.ai.ollama.chat.model=qwen2.5:3b
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-predict=512