spring.application.name=ebank-chatBott
spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

server.port=8084

# Connexion Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Connexion aux microservices MCP
spring.ai.mcp.client.streamable-http.connections.customer.url=http://localhost:8081/mcp
spring.ai.mcp.client.streamable-http.connections.account.url=http://localhost:8082/mcp

discord.token=${DISCORD_BOT_TOKEN}

# Modèle IA local
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:4b

# Paramètres du modèle
spring.ai.ollama.chat.options.temperature=0.7
spring.ai.ollama.chat.options.num-predict=512