
spring.application.name=gateway-service
server.port=9999

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

# Connexion Eureka
eureka.client.service-url.defaultZone=http://discoveru-service:8761/eureka/

# JWT
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8085/oauth2/jwks

# Découverte automatique des services
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.gateway.access=read-only
