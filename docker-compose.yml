
services:

  discoveru-service:
    build:
      context: ./discoveru-service
      dockerfile: Dockerfile
    container_name: discoveru-service
    ports:
      - "8761:8761"
    networks:
      - ebank-network

  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: customer-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discoveru-service
    networks:
      - ebank-network

  ebank-service:
    build:
      context: ./ebank-service
      dockerfile: Dockerfile
    container_name: ebank-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discoveru-service
      - customer-service
    networks:
      - ebank-network

  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    container_name: gateway-service
    ports:
      - "9999:9999"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - discoveru-service
    networks:
      - ebank-network

  ebank-chatbott:
    build:
      context: ./ebank-chatBott
      dockerfile: Dockerfile
    container_name: ebank-chatbott
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
    depends_on:
      - discoveru-service
      - customer-service
      - ebank-service
    networks:
      - ebank-network

networks:
  ebank-network:
    driver: bridge
