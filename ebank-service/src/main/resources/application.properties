spring.application.name=bank-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:bankAccount-db
spring.h2.console.enabled=true

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

# Connexion Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8085/oauth2/jwks
spring.security.oauth2.resourceserver.jwt.issuer-uri=ebank-auth-service

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=TRACE
logging.level.org.springframework.security.oauth2.jwt=TRACE
# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# MCP Server
spring.ai.mcp.server.protocol=streamable
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false