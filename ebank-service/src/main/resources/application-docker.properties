spring.application.name=bank-service
server.port=8082

spring.datasource.url=jdbc:h2:mem:bankAccount-db
spring.h2.console.enabled=true

spring.cloud.discovery.enabled=true
spring.cloud.config.enabled=false

# Connexion Eureka
eureka.client.service-url.defaultZone=http://discoveru-service:8761/eureka/
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://auth-service:8085/oauth2/jwks

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# MCP Server
spring.ai.mcp.server.protocol=streamable